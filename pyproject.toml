[project]
name = "retail-location-intelligence"
version = "0.1.0"
description = "Evidence-bound agentic retail site-selection prototype over the StateBook Atlas API"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    # Required so a key pasted into the UI works without a reinstall. No key, no calls.
    "openai>=1.50.0",
    # The UI is a Next.js app in web/, so the Python side is a headless HTTP service.
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "numpy>=2.4.6",
    "pyyaml>=6.0.0",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not live'"
markers = [
    "live: hits the real StateBook Atlas API (select with -m live)",
]

[tool.uv]
package = false
