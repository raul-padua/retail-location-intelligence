[project]
name = "retail-location-intelligence"
version = "0.1.0"
description = "Evidence-bound agentic retail site-selection prototype over the StateBook Atlas API"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.39.0",
    "pandas>=2.2.0",
    "altair>=5.4.0",
    # Required so a key pasted into the UI works without a reinstall. No key, no calls.
    "openai>=1.50.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    # Streamlit falls back to mtime polling without this, which reloads edited modules
    # unreliably and leaves a running server serving stale code.
    "watchdog>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not live'"
markers = [
    "live: hits the real StateBook Atlas API (select with -m live)",
]

[tool.uv]
package = false
